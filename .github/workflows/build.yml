name: Build Opacity Micro-Map SDK
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Build:
    name: Build-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            cmake-args: -A x64
            test-command: ./tests.exe '--gtest_filter=-*GPU*'
            artifact-name: Opacity Micro-Map SDK Windows
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
            cmake-args: -G "Ninja Multi-Config"
            test-command: ./tests
            artifact-name: Opacity Micro-Map SDK Linux
          - os: windows-11-arm
            platform: Windows
            arch: ARM64
            cmake-args: -A ARM64
            test-command: ./tests.exe
            artifact-name: Opacity Micro-Map SDK Windows ARM64 CPU
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: ARM64
            cmake-args: -G "Ninja Multi-Config"
            test-command: ./tests
            artifact-name: Opacity Micro-Map SDK Linux ARM64 CPU
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Windows dependencies
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        uses: crazy-max/ghaction-chocolatey@v2
        with:
          args: install windows-sdk-10.0 -y
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo Vulkan SDK version $ver
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:/VulkanSDK/" >> $env:GITHUB_ENV
          "C:/VulkanSDK/Bin" >> $env:GITHUB_PATH
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'
      - name: Setup Ninja
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install Linux Vulkan SDK
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          sudo apt install -y wget
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt update
          sudo apt install -y libwayland-dev wayland-protocols libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev vulkan-sdk
      - name: CMake Generate
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          cmake_args=(-DOMM_VIEWER_INSTALL=OFF)
          # Exercise the ARM64 CPU SDK without graphics dependencies or shader compilers.
          if [[ "$BUILD_ARCH" == "ARM64" ]]; then
            cmake_args+=(
              -DOMM_BUILD_VIEWER=OFF
              -DOMM_BUILD_OMM_GPU_NVRHI=OFF
              -DOMM_ENABLE_TESTS=ON
              -DOMM_ENABLE_GPU_TESTS=OFF
              -DOMM_ENABLE_PRECOMPILED_SHADERS_DXIL=OFF
              -DOMM_ENABLE_PRECOMPILED_SHADERS_SPIRV=OFF
              -DSHADERMAKE_FIND_COMPILERS=OFF
            )
          fi
          cmake -S . -B build ${{ matrix.cmake-args }} "${cmake_args[@]}"
      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test Release
        working-directory: build/bin/Release
        run: ${{ matrix.test-command }}
      - name: Install Release
        run: cmake --install build --config Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/install
          if-no-files-found: error
